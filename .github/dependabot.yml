# Weekly check of the app's npm packages. Without this, next sat on 14.2.3
# (exact pin from the first upload, Apr 2026) while 14.2.4-14.2.35 shipped
# security fixes, and nobody noticed until an `npm ci` warning on 2026-10-27.
# Patch/minor bumps arrive as one grouped PR; major bumps (e.g. next 14 -> 15)
# get their own PR so they can be tested separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /thelongcouncil
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Only propose versions that have been out for 14 days, so a hijacked or
    # broken release is usually caught upstream before it reaches us (same rule
    # as LongevityWatch). On 2026-10-28 three of five PRs held days-old versions.
    cooldown:
      default-days: 14
    groups:
      # react and react-dom must move together: on 2026-10-28 they arrived as
      # separate major PRs and neither could install (react-dom 18 requires
      # react 18). A package goes to the first group it matches, so this one
      # comes before minor-and-patch.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - minor
          - patch
